name: Import balancing workbook

on:
  workflow_dispatch:
    inputs:
      workbook:
        description: 'Committed workbook path under balance-input/ (e.g. balance-input/balance.xlsx)'
        required: true
        default: 'balance-input/balance.xlsx'
      baseline:
        description: 'Matching committed baseline JSON under balance-input/'
        required: true
        default: 'balance-input/baseline.json'
      apply:
        description: 'Create or update a pull request after validation (otherwise dry run)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: balance-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/balance/requirements.txt
      - run: python -m pip install -r tools/balance/requirements.txt
      - name: Validate and import
        env:
          BALANCE_WORKBOOK: ${{ inputs.workbook }}
          BALANCE_BASELINE: ${{ inputs.baseline }}
          BALANCE_APPLY: ${{ inputs.apply }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          root = Path.cwd()
          paths = []
          for variable in ('BALANCE_WORKBOOK', 'BALANCE_BASELINE'):
              path = (root / os.environ[variable]).resolve()
              if not path.is_relative_to(root / 'balance-input') or not path.is_file():
                  raise SystemExit('Inputs must be existing files under balance-input/')
              paths.append(str(path))
          command = ['python', 'tools/balance/balance.py', 'import',
                     '--workbook', paths[0], '--baseline', paths[1]]
          if os.environ['BALANCE_APPLY'] == 'true':
              command.append('--apply')
          subprocess.run(command, check=True)
          PY
      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-import-report-${{ github.run_id }}
          path: balance-output/import-report.json
          if-no-files-found: ignore
      - name: Create or update balancing PR
        if: inputs.apply
        env:
          GH_TOKEN: ${{ github.token }}
          BALANCE_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- gamemodes/ix_cotz lua; then
            echo 'No configuration changes; no pull request needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c automation/balance-import
          git add -- gamemodes/ix_cotz lua
          git commit -m 'Apply validated balancing spreadsheet changes'
          # The dedicated automation branch is regenerated from the current default branch.
          # Refuse to replace it if it moved after the fetch.
          expected=$(git rev-parse --verify refs/remotes/origin/automation/balance-import 2>/dev/null || true)
          git push --force-with-lease="refs/heads/automation/balance-import:$expected" origin HEAD:automation/balance-import
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('balance-output/import-report.json').read_text())
          lines = ['Apply balancing spreadsheet edits to the Lua configuration.', '',
                   f"Baseline commit: `{report['baseline_commit']}`", '',
                   'Validated every workbook row and checked concurrent source changes before writing.',
                   'Review the Lua diff and test changed gameplay in a development server.', '']
          for change in report['changes']:
              lines.append(f"- `{change['id']}` / `{change['field']}`: {change['before']!r} → {change['after']!r}")
          Path('/tmp/balance-pr-body.md').write_text('\n'.join(lines) + '\n')
          PY
          number=$(gh pr list --head automation/balance-import --base "$BALANCE_BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title 'Apply balancing spreadsheet changes' --body-file /tmp/balance-pr-body.md
          else
            gh pr create --base "$BALANCE_BASE_BRANCH" --head automation/balance-import --title 'Apply balancing spreadsheet changes' --body-file /tmp/balance-pr-body.md
          fi
